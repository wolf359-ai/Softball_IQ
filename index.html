<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Softball IQ: 12U</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@700&display=swap">
<style>
:root{--bg:#0A0A0A;--card:#161616;--ink:#F5F1E8;--mute:#BDB6AA;--grass:#1F5C36;--accent:#FF8A1F;--ball:#DDEB3A;--ok:#7FDB9A;--okbg:#143321;--bad:#FF9A92;--badbg:#3A1715;--line:#343434;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Barlow,"Helvetica Neue",Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1,.sb,.big{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-weight:700;letter-spacing:.02em}
h1{font-size:40px;line-height:1.05;margin:8px 0 6px}
h1,.sec{color:#fff}
.brand{max-width:640px;margin:0 auto;padding:16px 16px 0;display:flex;align-items:center;gap:12px}
.brand img{height:56px;width:auto;display:block}
.brand h1{font-size:38px;margin:0}
.sb{display:flex;justify-content:space-between;align-items:center;background:#1B1B1B;border:2px solid var(--accent);color:#fff;border-radius:10px;padding:6px 14px;font-size:20px;margin-bottom:14px}
.sb b{color:var(--accent);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;margin-bottom:12px}.row>div:last-child{flex:1 1 220px}
.outs{display:flex;gap:6px;align-items:center;font-size:15px;color:var(--mute);margin-top:6px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:transparent}
.dot.on{background:var(--accent)}
.tag{font-size:15px;color:var(--mute);font-weight:600}
.menu{background:transparent;border:2px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 14px;font-weight:600;font-size:16px;cursor:pointer;margin-bottom:12px}
.menu:hover{border-color:var(--accent)}
.sec{font:700 26px/1.1 "Barlow Condensed","Arial Narrow",Arial,sans-serif;letter-spacing:.02em;margin:20px 0 0}
.menu:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.q{font-size:19px;font-weight:600;margin:0}
.opts{display:grid;gap:10px;margin:14px 0}
button{font:inherit;color:var(--ink)}
.opt,.cat{width:100%;text-align:left;padding:13px 14px;min-height:52px;background:var(--card);border:2px solid var(--line);border-radius:10px;cursor:pointer}
.opt:hover:not(:disabled),.cat:hover{border-color:var(--accent)}
.opt:focus-visible,.go:focus-visible,.cat:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.opt:disabled{cursor:default}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt.no{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.opt.dim{opacity:.55}
.fb{border-radius:10px;padding:12px 14px;margin-bottom:12px}
.fb.ok{background:var(--okbg)}.fb.no{background:var(--badbg)}
.fb .big{font-size:24px;display:block}
.go{background:var(--accent);color:#111;border:0;border-radius:10px;padding:14px 22px;font-weight:600;font-size:18px;cursor:pointer;width:100%}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
.cat b{display:block;font-size:18px}.cat span{color:var(--mute);font-size:15px}
ul{padding-left:20px}li{margin-bottom:8px}
@media (prefers-reduced-motion:no-preference){.opt,.cat{transition:border-color .12s}}
</style>
</head>

<script>
const Q=[
{c:"Hitting",b:[0,1,0],o:0,q:`Your team has a runner on second and nobody out. You're up. What's your best plan at the plate?`,a:[`Hit a ground ball to the right side, even if it's an out`,`Swing as hard as you can for a home run`,`Take every pitch and wait for a walk`,`Bunt it straight back to the pitcher`],e:`A grounder to the right side moves the runner to third with one out, and she can score on a fly ball or another grounder. Swinging for the fence or bunting to the pitcher usually just gives the defense an easy out at third.`},
{c:"Hitting",b:[0,0,0],o:1,q:`The count is 3 balls and 0 strikes, and your coach hasn't given you a sign. What do you do?`,a:[`Take the pitch. A walk is a good result`,`Swing at anything close`,`Bunt for a hit`,`Step out and ask the umpire for time`],e:`At 3-0 the pitcher is struggling to find the zone. Unless your coach gives you the green light, take the pitch and let her walk you.`},
{c:"Hitting",b:[0,0,0],o:2,q:`You have two strikes. What's the best adjustment?`,a:[`Choke up, stay short to the ball, and protect the plate`,`Wait for your perfect pitch`,`Take a bigger swing to make up for it`,`Take the next pitch no matter what`],e:`With two strikes, a close pitch can be called strike three, so you have to swing at anything close. A shorter, quicker swing helps you make contact.`},
{c:"Hitting",b:[0,0,1],o:1,q:`Runner on third, one out, and the infield is playing back. What's the best at-bat?`,a:[`Hit a ground ball to score the run`,`Pop the ball up in the infield`,`Take three pitches`,`Bunt it hard to the pitcher`],e:`With the infield back, a grounder lets the runner score while the defense takes the out at first. Pop-ups usually keep her stuck at third, and a bunt to the pitcher gets her thrown out at home.`},
{c:"Hitting",b:[1,0,0],o:0,q:`Coach gives you the bunt sign with a runner on first and nobody out. Where should the bunt go?`,a:[`Down the first- or third-base line, away from the pitcher`,`Right back at the pitcher`,`Straight at the catcher`,`Pop it up in the air`],e:`You want the defense to field the ball far from the base they need to throw to. A bunt right at the pitcher or catcher lets them force the runner at second and wastes the sacrifice.`},
{c:"Fielding",b:[1,0,0],o:1,q:`Runner on first, one out. A ground ball is hit right to you at shortstop. What's your first move?`,a:[`Throw to second for the force, then on to first`,`Throw straight to first`,`Run over and tag the runner`,`Hold the ball`],e:`The runner on first has to run, so there's a force at second. Getting that out first sets up the double play. You don't need a tag when there's a force.`},
{c:"Fielding",b:[0,0,1],o:2,q:`Runner on third, two outs. A grounder is hit to you at second base. Where do you throw?`,a:[`First base for the easy out`,`Home plate to stop the run`,`Third base`,`Hold the ball`],e:`With two outs, any out ends the inning. If the batter is thrown out at first, the run from third doesn't count. Take the sure out.`},
{c:"Fielding",b:[0,0,0],o:0,q:`A pop fly drops between the second baseman and the right fielder. Who has priority?`,a:[`The outfielder: she's running toward the ball and should call it loudly`,`The infielder: she's faster`,`Whoever yells last`,`Both go for it`],e:`Outfielders have priority over infielders because they're running in and can see the whole field. Call "Mine!" loud and early so nobody collides.`},
{c:"Fielding",b:[0,1,0],o:1,q:`Runner on second. A single is hit to right field and the runner is rounding third. Where does the right fielder throw?`,a:[`To the cutoff player lined up with home`,`Over the cutoff, straight to the catcher every time`,`To second base`,`To the pitcher`],e:`The cutoff player lines up between you and home. She can catch the throw, let it go through, or cut it off to stop the batter from moving up. A good throw to the cutoff beats a wild throw home.`},
{c:"Rules",b:[1,1,0],o:0,q:`Runners on first and second, nobody out. The batter hits a high pop-up the shortstop can easily catch, and the umpire calls "Infield fly." What does that mean?`,a:[`The batter is out, and the runners can advance at their own risk`,`The ball is dead and everyone stays put`,`The batter is out only if the ball is caught`,`The runners must go back to their bases`],e:`Infield fly applies with fewer than two outs and runners on first and second (or bases loaded). The batter is out whether or not the ball is caught, so the defense can't drop it on purpose for a cheap double play.`},
{c:"Rules",b:[0,0,0],o:1,q:`Strike three is called, but the catcher drops the ball. First base is empty. What can the batter do?`,a:[`Run to first. She's out only if the catcher tags her or throws her out`,`Nothing, she's out`,`Walk back to the dugout`,`Run to first and she's automatically safe`],e:`With first base empty (or with two outs), the batter can run on a dropped third strike, but the defense can still get her out. With first base occupied and fewer than two outs, she's out.`},
{c:"Rules",b:[0,0,1],o:0,q:`Runner on third, nobody out. A fly ball is hit deep and caught. When can the runner leave third to score?`,a:[`Once the fielder first touches the ball`,`As soon as the ball leaves the bat`,`When the ball reaches its highest point`,`After the fielder throws it`],e:`She has to tag up, keeping a foot on the base, and can leave when the fielder first touches the ball. If she leaves early, the defense can appeal and she'll be out.`},
{c:"Rules",b:[0,0,1],o:2,q:`Runner on third, two outs. She crosses home, then the batter is thrown out at first for the third out. Does the run count?`,a:[`No. The batter was out at first before the run scored`,`Yes, because she touched home first`,`Yes, because the throw was late`,`Only if the umpire agrees`],e:`A run doesn't score if the third out is a force out or the batter-runner is out before reaching first. Timing only matters on non-force outs, like a tag at third.`},
{c:"Rules",b:[1,0,0],o:0,q:`You're the runner on first, and you take off before the pitch leaves the pitcher's hand. What happens?`,a:[`You can be called out for leaving early`,`You're safe if you make it to second`,`The pitch doesn't count`,`Your team gets a warning`],e:`In fastpitch you must keep a foot on the base until the pitch leaves the pitcher's hand. Leave early and the umpire can call you out.`},
{c:"Rules",b:[0,0,0],o:0,q:`A pitch hits you. You tried to get out of the way and didn't swing. What happens?`,a:[`You get first base`,`Nothing, it's a ball and the count goes up`,`You're out`,`You get a free swing`],e:`If you try to avoid the pitch and don't swing, you're awarded first base. If you make no attempt to avoid it, it's called a ball or strike like normal.`},
{c:"Rules",b:[0,0,0],o:0,q:`A batted ball first hits the first-base bag. Is it fair or foul?`,a:[`Fair, because the bag is in fair territory`,`Foul`,`The batter hits again`,`Dead ball, replay the pitch`],e:`A ball that touches first, second, or third base is fair. The lines are fair too.`},
{c:"Runners on",b:[1,0,0],o:0,q:`Runner on first, nobody out. A single is hit to you in right field. Where does your throw go?`,a:[`Third base, through a cutoff player lined up with it`,`Second base`,`First base`,`Back to the pitcher`],e:`Throw to the base ahead of the lead runner. The runner from first is trying to reach third, so a good throw there makes her stop at second. Throwing behind her to first or second doesn't stop anything.`},
{c:"Runners on",b:[0,1,0],o:2,q:`Runner on second, two outs. A single is hit to left field and the runner is running on contact. Where does your throw go?`,a:[`Home plate, hitting the cutoff player in line`,`Second base`,`Third base`,`First base`],e:`With two outs she's running on the pitch, so she scores from second if you let her. Throw home through the cutoff. If the cutoff sees the runner will be safe, she can cut the throw and hold the batter at first.`},
{c:"Runners on",b:[0,0,1],o:1,q:`Runner on third, one out. A fly ball is hit to you in right field. How do you set up for the catch?`,a:[`Get behind the ball and move toward home as you catch it`,`Stand still and catch it with your glove down`,`Run away from home so you can reach it`,`Catch it, then take three steps backward`],e:`Moving toward home as you catch gives you momentum for a stronger, quicker throw. Get behind the ball first so you can step into the throw.`},
{c:"Runners on",b:[0,1,0],o:1,q:`Runner on second. A ground ball gets through the infield and rolls to you in left field. What's the best way to field it?`,a:[`Charge it, get in front of it with two hands, and throw in one smooth motion`,`Wait for it to stop rolling`,`Let it go past you for the center fielder`,`Field it one-handed while running away`],e:`Charging cuts down the time the runner has to score. Stay in front of the ball so a bad hop doesn't roll past you, then keep your momentum going toward your target.`},
{c:"Runners on",b:[1,0,0],o:0,q:`Runner on first. A hard single is hit toward right field. You're the center fielder. What do you do?`,a:[`Run behind the right fielder to back her up`,`Stay in center field`,`Run in toward second base`,`Yell at the right fielder to hurry`],e:`Every ball hit to the outfield needs a backup. If the right fielder misses it, you're the only one stopping the runner from taking extra bases.`},
{c:"Runners on",b:[0,1,0],o:2,q:`Runner on second, two outs. A fly ball is hit in the gap between you in left field and the center fielder. You both go for it. Who takes it?`,a:[`The center fielder. She has priority over the other outfielders`,`The left fielder, because she's closer to the line`,`Whoever is faster`,`Neither of you; let it drop`],e:`The center fielder has priority because she can see the whole field. Both players call it loudly. The one with priority takes it, and the other backs her up.`},
{c:"Runners on",b:[0,1,0],o:1,q:`Runner on second. A single is hit to left field, and a throw home will clearly be too late. As the cutoff player, what do you do?`,a:[`Cut the throw and keep the batter from taking an extra base`,`Let it go through to the plate anyway`,`Throw it back to the outfielder`,`Hold it and wait for a call`],e:`When the runner is clearly safe, a throw home is wasted and the batter can move up. The cutoff player cuts it off and keeps the batter at first. A teammate calls "cut" or "let it go" so everyone knows the play.`},
{c:"Runners on",b:[1,0,0],o:0,q:`Runner on first. Your right fielder fields a single and throws to third base. As the left fielder, where do you go?`,a:[`Behind third base to back up the throw`,`Toward second base`,`Stay in left field`,`To the pitcher's circle`],e:`If the throw gets past the third baseman, the runner can score or take extra bases. The left fielder backs up third on throws from right field.`},
{c:"Runners on",b:[0,0,1],o:0,q:`Runner on third. The ball is hit to the outfield and a throw is coming home. As the pitcher, where do you go?`,a:[`Behind home plate to back up the throw`,`Stay on the pitching rubber`,`Cover first base`,`Run toward third base`],e:`A throw that gets past the catcher lets the runner score easily, so the pitcher backs up home from behind the plate. Backing up is part of every play.`},
{c:"Runners on",b:[0,1,0],o:1,q:`Runner on second, one out. A sinking line drive is hit in front of you in left field. Should you dive?`,a:[`Only if you're sure you can catch it. Otherwise play it on a hop`,`Always dive; it's the only play`,`Never dive`,`Let it drop and run in`],e:`If you miss a diving catch, the ball can roll to the wall and the runner scores, maybe the batter too. With a runner on, keep the ball in front of you unless you're confident you can catch it.`},
{c:"Runners on",b:[1,1,0],o:1,q:`Runners on first and second, one out. Before the pitch, what should you be thinking about as an outfielder?`,a:[`If it's hit to me, which base is my throw going to and who is my cutoff?`,`Nothing; I'll figure it out when the ball is hit`,`Where my family is sitting`,`What the score is on the other field`],e:`Know the outs and runners on every pitch and decide your plan ahead of time. With one out you might go for the lead runner. With two outs you might make the sure play.`},
{c:"Runners on",b:[0,1,0],o:0,q:`Runner on second, nobody out. You field a single in left field and see the runner stop at third. Where do you throw?`,a:[`To the infield cutoff, so the batter doesn't take second`,`Home plate`,`Third base`,`Hold it in the outfield`],e:`The runner stopped at third, so there's no play at the plate. The next danger is the batter taking second on a throw. Get the ball to the infield and keep everyone where they are.`},
{c:"Runners on",b:[1,0,0],o:0,q:`Runner on first takes off to steal second. You're the catcher. Where does your throw go?`,a:[`Low, right at the bag at second`,`High, over the second baseman's head`,`To first base`,`Back to the pitcher`],e:`A throw that's low and on the bag gets the glove down to the runner faster. A high throw takes extra time to bring down for the tag.`},
{c:"Runners on",b:[0,0,1],o:0,q:`Runner on third, nobody out, and your team has the infield playing in. A ground ball is hit to you. Where do you throw?`,a:[`Home plate, if she's running, to stop the run`,`Second base`,`Over the first baseman's head`,`Straight to the pitcher`],e:`Playing in means you're protecting against the run scoring on a ground ball. If she breaks for home, get her out at the plate. If she holds at third, take the sure out at first.`},
{c:"Runners on",b:[1,0,0],o:0,q:`Runner on first, nobody out. The batter bunts a ball right to the pitcher. What's the safest decision?`,a:[`Take the sure out at first unless you clearly have the runner at second`,`Always throw to second`,`Hold it and look around`,`Throw it to the catcher`],e:`The out at first is almost always available. Throwing to second only works if you beat the runner there and your teammate is ready. A rushed throw into the outfield loses everything.`},
{c:"Runners on",b:[0,1,0],o:1,q:`Runner on second, one out. The runner gets caught between second and third. What's the best way to run the rundown?`,a:[`Run at her hard with the ball up and make one throw, two at most`,`Walk the ball to her slowly`,`Throw back and forth as many times as you can`,`Stand still and wait for her to run to you`],e:`The fewer throws, the fewer chances for a mistake. Drive the runner back toward the base she came from. After you throw, step out of the baseline.`},
{c:"Runners on",b:[1,1,1],o:1,q:`Bases loaded, one out. A ground ball is hit to you at shortstop. What's the best throw?`,a:[`Home for the force, then on to first if you can`,`Straight to first`,`To second`,`To third`],e:`With the bases loaded every runner is forced, so you can get the force at home and stop the run from scoring. A throw to first only gets one out and lets the run score.`},
{c:"Runners on",b:[0,0,1],o:0,q:`The runner on third is heading home, and the ball is still out in left field. Where should the catcher stand?`,a:[`To the side of the plate, giving the runner a lane to slide`,`Right on the plate, blocking it`,`Out in front of the plate`,`Behind the umpire`],e:`A catcher can't block the plate unless she has the ball or is about to catch it. Blocking early is obstruction, and the runner would be safe.`},
{c:"Runners on",b:[1,0,0],o:1,q:`The runner is sliding into second and the throw arrives. How do you make the tag?`,a:[`Catch the ball first, then sweep a low tag with it secure in your glove`,`Swing your glove at her before the ball arrives`,`Tag her high and hope`,`Stand on the bag with your eyes closed`],e:`A tag only counts if you're holding the ball. Catch it first, then drop a quick low tag in her path so she slides into your glove. Keep the ball secure.`},
{c:"Runners on",b:[0,1,0],o:1,q:`A ball is hit to the outfield with a runner on second. Who tells the cutoff player where the throw goes?`,a:[`The catcher, who sees the whole play`,`The umpire`,`The batter`,`Nobody; she guesses`],e:`The catcher faces the field and can see the runners, so she calls the play. Cutoff players have their backs to the plate and must listen. Loud, clear calls like "Home!" or "Hold it!" prevent mistakes.`},
{c:"Fielding",p:"P",b:[0,0,1],o:1,h:['g',110,150],q:`Runner on third, one out. A ground ball is hit right back to you. What's the plan?`,a:[`If she's running, throw home. If she holds, take the sure out at first`,`Always throw to first`,`Always throw home`,`Hold the ball and wait`],e:`Read the runner first. A runner who breaks gives your catcher an out at the plate. If she holds at third, don't force a bad throw. Just take the sure out at first.`},
{c:"Fielding",p:"P",b:[0,0,0],o:0,h:['g',140,126],q:`A ground ball is hit to the first baseman, who is pulled off the bag toward second base. As the pitcher, where do you go?`,a:[`Cover first base and take the throw`,`Stay on the pitching rubber`,`Back up home plate`,`Run to third base`],e:`With the first baseman off the bag, the pitcher covers first. Run to the bag at an angle that lets you catch the throw and step on it.`},
{c:"Fielding",p:"P",b:[0,0,1],o:0,q:`Runner on third. A pitch gets past the catcher to the backstop. As the pitcher, where do you go?`,a:[`Cover home plate to take the throw from the catcher`,`Chase the ball to the backstop`,`Back up first base`,`Stay on the rubber`],e:`The catcher retrieves the ball, so the pitcher covers the plate for the tag. Get there fast and give her a target.`},
{c:"Fielding",p:"P",b:[0,1,0],o:1,q:`Runner on second, one out. After you release the pitch, what should you be ready to do?`,a:[`Field the ball: finish balanced, facing the batter, glove ready`,`Turn and look at the dugout`,`Walk toward the plate`,`Stand tall and wait`],e:`The pitcher is also an infielder. Bunts and comebackers come fast, so finish your pitch balanced and ready to field.`},
{c:"Fielding",p:"C",b:[0,0,1],o:1,q:`Runner on third, one out. A pitch bounces in the dirt in front of you. What's the best way to stop it?`,a:[`Drop to both knees and block it, glove between your legs, chin down`,`Reach out with just your glove`,`Stand up and let it go by`,`Swipe at it with one hand`],e:`Keeping the ball in front of you stops the runner from scoring on a wild pitch. Get both knees down, close the glove, and tuck your chin.`},
{c:"Fielding",p:"C",b:[1,0,0],o:0,q:`The batter pops the ball up behind home plate. What's the first thing you do?`,a:[`Rip off your mask, find the ball, and toss the mask away from where you're going`,`Keep the mask on and watch`,`Wait for someone else to call it`,`Run toward first base`],e:`The mask blocks your view and can trip you. Take it off, find the ball, and throw the mask away from your path.`},
{c:"Fielding",p:"C",b:[1,0,0],o:1,q:`Runner on first takes off to steal second. How do you get your throw off quickly?`,a:[`Catch, step, and throw from your ear in one quick motion`,`Stand up, wind up, and take a big step`,`Walk toward the pitcher first`,`Throw sidearm from your knee`],e:`Time decides a steal. A short, quick arm gets the ball to second faster than a big windup.`},
{c:"Fielding",p:"C",b:[0,0,1],o:0,q:`Runner on third. A pitch gets by you to the backstop. What do you do?`,a:[`Find the ball fast and flip or throw it to the pitcher covering home`,`Walk slowly to the backstop`,`Wait for the umpire to hand it to you`,`Leave it for the pitcher`],e:`The pitcher covers home on a wild pitch, so your job is to get the ball back quickly and accurately.`},
{c:"Fielding",p:"3B",b:[1,0,0],o:0,h:['g',86,154],q:`Runner on first, nobody out. The batter bunts toward third base. What do you do as the third baseman?`,a:[`Charge hard, field it with two hands, and make the safe throw to first`,`Stay at third`,`Let the pitcher get it`,`Wait for the ball to stop rolling`],e:`Charging gives you time. Take the sure out at first unless you're certain you can get the lead runner.`},
{c:"Fielding",p:"3B",b:[1,0,0],o:1,h:['g',64,134],q:`Runner on first, one out. A grounder is hit to you at third. What's your best throw?`,a:[`Second base, to start the double play`,`Third base`,`Home plate`,`Straight to the pitcher`],e:`The runner from first is forced at second, so you can start a double play. Make a strong, accurate throw to the shortstop or second baseman covering.`},
{c:"Fielding",p:"3B",b:[0,0,1],o:1,h:['f',50,150],q:`Runner on third, one out. A foul pop-up is hit near the third-base line. Do you catch it?`,a:[`Yes, an out is an out, even if the runner tags up and scores`,`No, let it fall foul`,`Let the catcher handle it`,`Only if the runner stays on third`],e:`Catching it gives your team an out. If you let it drop, the batter gets another chance. Watch the runner, though, because she can tag up.`},
{c:"Fielding",p:"CF",b:[1,0,0],o:0,h:['f',108,32],q:`Runner on first. A deep drive sails over your head in center field. What's the plan?`,a:[`Run it down, get it back quickly, and hit the relay player`,`Throw it straight home from the fence`,`Wait for it to stop rolling`,`Let the left fielder chase it`],e:`A long throw from the fence is risky and often wild. Get the ball in fast to the relay player, who throws it the rest of the way.`},
{c:"Fielding",p:"CF",b:[0,1,0],o:0,h:['f',110,86],q:`Runner on second, nobody out. You catch a shallow fly ball in center, and the runner tags toward third. What do you do?`,a:[`Throw to third base with a cutoff in line`,`Throw to second base`,`Throw it straight to the pitcher`,`Hold the ball`],e:`Throw to the base ahead of the lead runner. A throw to third with a cutoff in line can stop her or keep the ball in play if she holds.`},
{c:"Fielding",p:"1B",b:[1,0,0],o:0,h:['g',88,118],q:`Runner on first, nobody out. A ground ball goes to the shortstop, who throws to second for the force. Where do you go?`,a:[`Get to first base and be ready for the relay throw`,`Run toward second base`,`Stay in foul territory`,`Back up the catcher`],e:`If the second out is made, the next throw can go to first for a double play. Get to the bag early, give a target, and stretch.`},
{c:"Fielding",p:"1B",b:[0,1,0],o:0,h:['g',130,158],q:`Runner on second, nobody out. The batter bunts toward first and you charge. Who covers first base?`,a:[`The second baseman`,`Nobody`,`The pitcher`,`The right fielder`],e:`When the first baseman charges, the second baseman usually covers first to take the throw. Call it out loud so everyone knows.`},
{c:"Fielding",p:"RF",b:[0,0,0],o:0,h:['g',130,118],q:`A ground ball is hit to the second baseman with nobody on. Where does the right fielder go?`,a:[`Behind first base to back up the throw`,`Stay where you are`,`Go to second base`,`Walk toward the dugout`],e:`If the throw gets past first base, you stop the runner from taking extra bases. Every outfielder has a backup job on every play.`},
{c:"Fielding",p:"P",b:[1,1,0],o:0,h:['g',108,154],q:`Runners on first and second, nobody out. A bunt rolls to you. Where do you throw?`,a:[`Third base, where the shortstop covers, for the force if you have time. Otherwise first base, where the second baseman covers`,`Home plate`,`Second base`,`Hold the ball`],e:`With runners on first and second there is a force at third. Getting the lead runner is worth it only if you can beat her. Otherwise take the out at first and keep the runners from advancing further.`},
{c:"Fielding",p:"P",b:[0,1,0],o:1,q:`You just gave up a hit with a runner on second. What's your next job?`,a:[`Take a breath, reset, and focus on the next pitch`,`Argue with the umpire`,`Glare at your fielders`,`Rush the next pitch to make up for it`],e:`The next pitch is the only one you can control. Reset with a breath and a plan, and trust your defense.`},
{c:"Fielding",p:"P",b:[1,1,0],o:0,h:['f',110,150],q:`Runners on first and second, nobody out. The umpire calls infield fly on a pop-up near the mound. What do you do?`,a:[`Catch it if you can. The batter is out either way`,`Let it drop and throw to second`,`Let it drop and throw to third`,`Run to cover first`],e:`With an infield fly, the batter is out whether or not you catch it. Catching it keeps the play simple. Then check the runners, who can still tag up.`},
{c:"Fielding",p:"P",b:[1,0,1],o:1,h:['g',108,154],q:`Runners on first and third, one out. A comebacker is hit to you and the runner on third holds. Where do you throw?`,a:[`Second base to start a double play`,`Home plate`,`First base only`,`Hold the ball`],e:`The runner on first is forced at second, so you can start a double play. A double play ends the inning before more damage is done. Keep an eye on the runner at third.`},
{c:"Fielding",p:"C",b:[0,0,1],o:1,q:`A throw is coming home as the runner slides. When do you tag her?`,a:[`After the ball is secure in your glove, tagging low in front of the plate`,`Before you catch it, to save time`,`After she stands up`,`You don't tag her`],e:`A tag only counts with the ball in your hand or glove. Catch it cleanly, then sweep a low tag. Stay out of her path until you have the ball.`},
{c:"Fielding",p:"C",b:[0,0,0],o:0,h:['g',88,118],q:`A ground ball is hit to the shortstop with nobody on base. Where does the catcher go?`,a:[`Behind first base to back up the throw`,`Stay at home plate`,`Go to third base`,`Go to the pitcher's circle`],e:`If the throw gets past first base, you can keep the batter from taking extra bases. Hustle to back up plays at first.`},
{c:"Fielding",p:"C",b:[1,0,0],o:0,h:['g',110,166],q:`A bunt rolls just in front of home plate with a runner on first. What do you do?`,a:[`Call 'Mine!', pop up, grab it with two hands, and make a smart throw`,`Wait for the pitcher to get it`,`Let it roll foul`,`Throw without looking`],e:`Catchers field bunts near the plate. Call it so nobody collides. Check the runners, then take the sure out at first unless the lead runner is an easy out.`},
{c:"Fielding",p:"C",b:[1,1,0],o:1,q:`Runners on first and second, one out. What should the catcher do before each pitch?`,a:[`Check outs and runners, then show fingers to your teammates`,`Look at the stands`,`Wait for the umpire`,`Nothing`],e:`The catcher sees the whole field. Remind your teammates of the outs and the plan so everyone knows where the throw goes.`},
{c:"Fielding",p:"1B",b:[0,0,0],o:0,h:['g',88,118],q:`The shortstop's throw to you is high. What do you do?`,a:[`Stay on the bag and reach or jump for it. If it's too high or wide, leave the bag to catch it`,`Leave the base right away`,`Let it go by`,`Close your eyes and catch`],e:`If you can catch it while touching the bag, do it. If the throw is too high or wide, protect the ball first and then try to tag the runner.`},
{c:"Fielding",p:"1B",b:[0,0,0],o:0,h:['f',176,150],q:`A pop-up drifts into foul territory near first base. Who takes it?`,a:[`The player with the best angle calls it loudly. It's often the first baseman`,`Whoever is closest to the dugout`,`The pitcher`,`Nobody`],e:`Call 'Mine!' early and loudly so teammates can get out of the way. The player moving toward the ball usually has the best look.`},
{c:"Fielding",p:"1B",b:[1,0,0],o:1,h:['g',146,132],q:`Runner on first, one out. A grounder is hit to you and the pitcher covers first. What's your best play?`,a:[`Throw to second for the force, then take the throw back if you have time`,`Toss to the pitcher at first`,`Hold the ball`,`Run to second yourself`],e:`The runner on first is forced at second, so you can start a double play. Make a good throw to the shortstop or second baseman covering the bag.`},
{c:"Fielding",p:"1B",b:[0,1,0],o:1,h:['g',166,84],q:`Runner on second. A single is hit to right field. As the first baseman, where do you set up?`,a:[`Lined up between the right fielder and home plate as the cutoff`,`On first base`,`Behind third base`,`In foul territory`],e:`The first baseman is the usual cutoff for throws home from right field. Line up with the plate, hold your hands up, and listen for the catcher's call.`},
{c:"Fielding",p:"2B",b:[1,0,0],o:0,h:['g',88,118],q:`Runner on first, nobody out. A ground ball goes to the shortstop. You're covering second. What do you do?`,a:[`Get to the bag, give a target, and turn the throw to first away from the runner`,`Stay at your position`,`Chase the ball`,`Run to first`],e:`Catch the ball with your foot on or near the bag, then get out of the runner's path as you throw to first.`},
{c:"Fielding",p:"2B",b:[1,0,0],o:1,h:['f',150,50],q:`Runner on first, one out. A ball is hit deep to right-center field. Where do you go?`,a:[`Out as the relay player, lined up with the outfielder and the base the lead runner is heading to`,`Stay at second`,`Cover first`,`Back up home plate`],e:`Middle infielders are relay players on deep hits. Go out, turn, and hold your arms up as a target.`},
{c:"Fielding",p:"2B",b:[1,0,0],o:0,h:['g',130,158],q:`Runner on first. The batter bunts toward first and the first baseman charges. Where do you go?`,a:[`Cover first base to take the throw`,`Cover second base`,`Stay at your position`,`Go home`],e:`When the first baseman charges, the second baseman covers first. The shortstop covers second if the runner is going there.`},
{c:"Fielding",p:"2B",b:[0,1,0],o:1,h:['g',124,112],q:`A hard grounder is hit toward your glove side, up the middle. What's the best technique?`,a:[`Get in front if you can. If not, backhand it, plant your foot, and throw`,`Dive and hope`,`Wait for it to slow down`,`Let the shortstop handle it`],e:`Moving your feet to get in front is best, but a good backhand with a firm plant keeps you in the play.`},
{c:"Fielding",p:"SS",b:[1,0,0],o:0,h:['f',70,50],q:`Runner on first. A ball is hit deep to left-center field. As the shortstop, what's your job?`,a:[`Go out as the relay player, lined up between the outfielder and the base she's throwing to`,`Cover second only`,`Stay at your position`,`Back up first`],e:`Shortstops usually relay deep balls to the left side. Go out, turn, and give a big target.`},
{c:"Fielding",p:"SS",b:[0,0,0],o:0,h:['g',74,126],q:`A hard grounder is hit deep in the hole between third and short. What's the best throw?`,a:[`Plant your back foot and make a strong, accurate throw to first`,`Throw off-balance across your body`,`Hold the ball`,`Throw to second`],e:`Take the extra step to get set. A strong, accurate throw beats a rushed one.`},
{c:"Fielding",p:"SS",b:[0,1,0],o:1,h:['f',70,94],q:`A pop-up falls between you and the left fielder, who is running in. Who takes it?`,a:[`The left fielder, since she's running toward the ball`,`You, because you're an infielder`,`Whoever yells last`,`Neither of you`],e:`The player moving toward the ball sees it better, and outfielders take priority over infielders. Call it early and back each other up.`},
{c:"Fielding",p:"SS",b:[1,1,0],o:1,h:['g',88,118],q:`Runners on first and second, one out. A grounder is hit to you. What do you do?`,a:[`Throw to second for the force to start a double play`,`Throw to third`,`Throw to first`,`Tag the runner`],e:`The runner from first is forced at second, so you can start a double play. Make the throw quickly to the second baseman covering the bag.`},
{c:"Fielding",p:"3B",b:[0,1,0],o:0,h:['g',64,134],q:`A hard shot is hit right at you and you can't field it cleanly. What's the priority?`,a:[`Keep it in front of you so the runner can't advance`,`Jump out of the way`,`Reach with only your glove`,`Cover your face and wait`],e:`With a runner on, a ball that gets by you can mean extra bases. Block it, pick it up, and then make the best throw.`},
{c:"Fielding",p:"3B",b:[0,1,0],o:1,q:`Runner on second steals third. The throw arrives. How do you set up?`,a:[`Get in front of the bag, catch the ball, and tag low`,`Stand behind the bag with your glove high`,`Stand on the bag`,`Wait for the ball to bounce`],e:`Give the thrower a target, catch it, and apply a low tag where the runner is sliding.`},
{c:"Fielding",p:"3B",b:[1,1,0],o:0,h:['g',80,152],q:`Runners on first and second, nobody out. A bunt rolls to you next to third base. What's your best play?`,a:[`Throw to the shortstop covering third for the force, or take the sure out at first`,`Throw to second`,`Throw home`,`Hold the ball`],e:`On your team's bunt play the shortstop covers third and the second baseman covers first. Both runners are forced, so get the lead runner if you have a good throw. Otherwise take the sure out at first.`},
{c:"Fielding",p:"3B",b:[0,1,0],o:1,h:['g',74,150],q:`A slow roller dribbles toward third. Runner on second. What's the best way to field it?`,a:[`Charge it fast, use two hands if you can, and set up for the throw to first`,`Wait for it to stop rolling`,`Back away from it`,`Let the pitcher get it`],e:`Charging cuts down the time the batter has to reach first. Stay under control and make an accurate throw.`},
{c:"Fielding",p:"LF",b:[1,0,0],o:0,h:['f',58,40],q:`A fly ball is hit over your head with a runner on first. What's your first move?`,a:[`Turn and run to where the ball will land, keeping your eyes on it`,`Backpedal slowly`,`Wait to see where it lands`,`Drop to your knees`],e:`Turning and running on an angle gets you to the spot faster than backpedaling. Look up to find the ball.`},
{c:"Fielding",p:"LF",b:[0,1,0],o:0,h:['g',24,92],q:`Runner on second. A ball is hit down the left-field line toward the corner. What do you do?`,a:[`Get to it quickly, turn, and throw to the cutoff`,`Wait for it to stop in the corner`,`Throw it home from the corner`,`Let the third baseman get it`],e:`Get the ball back in fast. The cutoff player can then throw to the right base. A wild long throw lets more runners score.`},
{c:"Fielding",p:"LF",b:[0,0,1],o:1,h:['f',58,84],q:`You catch a fly ball in left field with a runner tagging at third. How should your throw travel?`,a:[`On a line, low, through the cutoff`,`As high as you can`,`On a slow roll`,`Straight to the pitcher`],e:`A low, strong throw gets there quickly and is easier to catch. Get behind the ball and move toward your target as you throw.`},
{c:"Fielding",p:"LF",b:[0,1,0],o:1,h:['f',30,78],q:`A fly ball is hit near the fence in left. How can you tell how close the wall is?`,a:[`Keep your eyes on the ball and feel for the fence with your free hand`,`Turn around and look at the fence`,`Close your eyes`,`Slow down`],e:`Looking away loses the ball. Use the warning track and your free hand to find the wall while tracking the ball.`},
{c:"Fielding",p:"CF",b:[0,1,0],o:2,h:['f',82,64],q:`You and the left fielder both call for a ball in left-center. What should you say?`,a:[`Call 'Mine!' loudly, since you have priority`,`Say nothing`,`Yell 'You take it!'`,`Wait for her`],e:`The center fielder has priority and can see the whole field. A loud, early call keeps everyone safe.`},
{c:"Fielding",p:"CF",b:[0,0,1],o:1,h:['f',110,44],q:`Runner on third, one out. You catch a deep fly in center and the runner tags up. Where does your throw go?`,a:[`Home, through the cutoff`,`Second base`,`First base`,`The pitcher`],e:`Throw toward the base the runner is going to. The cutoff can cut it off if the runner is clearly safe.`},
{c:"Fielding",p:"CF",b:[1,0,0],o:0,h:['g',112,60],q:`Runner on first. A single is hit up the middle to you. Where do you throw?`,a:[`Third base, through the cutoff, to hold the runner at second`,`First base`,`Second base`,`The pitcher`],e:`Throw to the base ahead of the lead runner. A good throw to third keeps her from taking an extra base.`},
{c:"Fielding",p:"CF",b:[1,0,0],o:0,q:`A runner steals second and the catcher's throw heads to second base. Where does the center fielder go?`,a:[`In behind second base to back up the throw`,`Stay deep`,`Go to first`,`Cover home`],e:`If the throw gets by the second baseman, you can stop the ball and keep the runner from taking third.`},
{c:"Fielding",p:"RF",b:[0,1,0],o:1,h:['f',168,80],q:`A fly ball is hit into the sun. What's the best way to catch it?`,a:[`Shield your eyes with your glove and call for help from teammates`,`Close your eyes`,`Look straight at the sun`,`Let it drop`],e:`Use your glove to block the sun while keeping the ball in sight. Call for help if you lose it.`},
{c:"Fielding",p:"RF",b:[1,0,0],o:0,h:['g',196,92],q:`Runner on first. A ball is hit down the right-field line and kicks toward the fence. What do you do?`,a:[`Get to it quickly, turn, and hit the cutoff`,`Wait for it to stop`,`Throw home from the fence`,`Let it roll`],e:`Get the ball in fast. A quick throw to the cutoff stops the runner from taking extra bases.`},
{c:"Fielding",p:"RF",b:[1,0,0],o:0,h:['g',64,134],q:`Runner on first. A ground ball is hit to third base. Where does the right fielder go?`,a:[`Behind first base to back up the throw`,`Stay in right field`,`Go to second base`,`Walk in`],e:`Balls hit to the left side can mean a long throw to first. If it gets by, you stop the runner from taking extra bases.`},
{c:"Fielding",p:"RF",b:[0,1,1],o:1,h:['f',160,70],q:`Runners on second and third, one out. A fly ball is hit to you in short right. What do you do?`,a:[`Catch it moving toward home and throw to the right base`,`Wait for it to drop`,`Throw it straight into the stands`,`Hold the ball`],e:`Moving toward home as you catch gives your throw more power. Get the out first, then make a good throw.`},
{c:"Fielding",p:"LF",b:[1,0,0],o:0,h:['g',86,154],q:`Bunt play: the first baseman, third baseman, and pitcher crash, the second baseman covers first, and the shortstop covers third. Where does the left fielder go?`,a:[`Behind third base to back up the throw`,`Stay in left field`,`Cover first base`,`Go to the pitcher's circle`],e:`If the throw to third gets away, the runner can take extra bases. Outfielders back up the bases on bunts.`},
{c:"Fielding",p:"LF",b:[1,0,0],o:1,h:['f',24,100],q:`Runner on first, one out. A foul fly drifts toward the left-field fence. Do you catch it?`,a:[`Yes, if you can do it safely. An out is an out`,`No, always let it drop`,`Only if a coach tells you`,`Only with two outs`],e:`Catching it gets an out, even if the runner tags up. Slow down near the fence and use your free hand to feel for it.`},
{c:"Fielding",p:"LF",b:[0,1,0],o:1,h:['g',58,86],q:`Runner on second, one out. You bobble a single in left field. What's next?`,a:[`Pick it up, set your feet, and make a strong throw to the cutoff`,`Throw it off-balance right away`,`Walk it in`,`Wait for help`],e:`A rushed throw can go wild and let more runners advance. Stay calm and make an accurate throw.`},
{c:"Fielding",p:"LF",b:[0,1,0],o:1,h:['g',54,84],q:`Runner on second. A single is hit to left. Which infielder is the usual cutoff for a throw home?`,a:[`The third baseman`,`The first baseman`,`The second baseman`,`The pitcher`],e:`The third baseman usually lines up with home for throws from left field. Follow your coach's call and the catcher's directions.`},
{c:"Fielding",p:"LF",b:[0,0,1],o:1,q:`Runner on third, one out. Where should you play?`,a:[`A little shallower, so you can throw out a tagging runner`,`As deep as possible`,`Behind the infield`,`Along the foul line`],e:`With a runner on third and one out, a fly ball scores the run. Playing a bit in gives you a better chance to throw her out.`},
{c:"Fielding",p:"LF",b:[0,1,0],o:0,q:`How should you throw from left field to a cutoff?`,a:[`Crow hop, step toward your target, and throw overhand on a line`,`Throw underhand`,`Throw sidearm off your back foot`,`Throw as high as you can`],e:`A crow hop gives you power and accuracy. A throw on a line gets there quickly and is easy to catch.`},
{c:"Fielding",p:"LF",b:[1,1,0],o:0,h:['g',54,84],q:`Runners on first and second, nobody out. A single is hit to you. Where does your throw go?`,a:[`To the base the lead runner is heading to, through the cutoff`,`First base`,`Second base`,`The pitcher`],e:`Throw ahead of the lead runner. A good throw can stop the lead runner or keep the other runner from advancing.`},
{c:"Fielding",p:"LF",b:[0,1,0],o:1,h:['f',58,84],q:`A fly ball is hit to you. What do you say?`,a:[`'Mine!' loudly and early`,`Nothing`,`'Your ball!' to the shortstop`,`Wait for someone else`],e:`A loud, early call keeps teammates from colliding. Everyone else should back you up.`},
{c:"Fielding",p:"LF",b:[0,1,0],o:0,h:['f',58,84],q:`Runner on second, nobody out. You catch a fly ball in left and the runner tags up for third. What do you do?`,a:[`Throw to third base, with a cutoff in line, if you have a play`,`Throw to second`,`Throw home`,`Hold the ball`],e:`Throw to the base ahead of the lead runner. Don't force a wild throw if she is going to be safe.`},

  const opts=sh(q.a.map((t,k)=>({t,k})));
  app.innerHTML=`<button class="menu" id="menu">← Main menu</button><div class="sb"><span>Question <b>${i+1}</b> of ${deck.length}</span><span>Score <b>${score}</b></span></div>
  <div class="card"><div class="row"><div><div id="dg">${dia(q.b,q.o,q.h,q.m,0)}</div>${outs(q.o)}${q.h?`<div class="outs">Dotted line shows where the ball goes</div>`:""}</div><div><div class="tag">${q.c}</div><p class="q">${q.q}</p></div></div>
  <div class="opts" id="opts">${opts.map(o=>`<button class="opt" data-k="${o.k}">${o.t}</button>`).join("")}</div>
  <div id="fb" aria-live="polite"></div></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(b,q));
  document.getElementById("menu").onclick=home;
}
function pick(btn,q){
  if(done)return;done=true;
  const right=btn.dataset.k==="0";
  if(right){score++;sv(ld().filter(x=>x!==q.q))}else{q.pick=btn.textContent;missed.push(q);sv([...new Set([...ld(),q.q])])}
  if(q.m)document.getElementById("dg").innerHTML=dia(q.b,q.o,q.h,q.m,1)+`<div class="outs">Dashed arrows show where your teammates move</div>`;
  app.querySelectorAll(".opt").forEach(b=>{b.disabled=true;
    if(b.dataset.k==="0")b.classList.add("ok");else if(b===btn)b.classList.add("no");else b.classList.add("dim")});
  const last=i===deck.length-1;
  document.getElementById("fb").innerHTML=`<div class="fb ${right?"ok":"no"}"><span class="big">${right?"That's the play!":"Not the best play"}</span>${right?"":`<div><b>Best answer:</b> ${q.a[0]}</div>`}<div style="margin-top:6px">${q.e}</div></div><button class="go" id="next">${last?"See my score":"Next question"}</button>`;
  const n=document.getElementById("next");n.onclick=()=>{if(last)end();else{i++;show()}};n.focus();
}
function end(){
  const p=Math.round(score/deck.length*100);
  const msg=p>=90?"All-star IQ.":p>=70?"Solid. You're reading the game well.":"Good start. Review the plays below and try again.";
  app.innerHTML=`<div class="sb"><span>Final score</span><span><b>${score}</b> of ${deck.length}</span></div>
  <div class="card"><p class="big" style="font-size:28px;margin:0 0 8px">${msg}</p>
  ${missed.length?`<p style="margin:0 0 6px"><b>Plays to review</b></p><ul>${missed.map(q=>`<li>${q.q}<br><span style="color:var(--ok)"><b>Best:</b> ${q.a[0]}</span></li>`).join("")}</ul>`:`<p>You got every one. Nice.</p>`}
  <div class="opts">${missed.length?`<button class="go" id="rv">Review missed plays</button><button class="opt" id="re">Retry missed plays</button>`:""}<button class="opt" id="again">Back to main menu</button></div></div>`;
  const re=document.getElementById("re");if(re){const m=missed.slice();re.onclick=()=>start(m)}
  const rv=document.getElementById("rv");if(rv){const m=missed.slice();rv.onclick=()=>review(m)}
  document.getElementById("again").onclick=home;
}
home();
</script>
</body>
</html>
